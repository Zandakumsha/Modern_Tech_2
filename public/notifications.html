  <style>
    .request-view-modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.request-view-modal.show{display:flex}.request-view-box{background:#fff;width:min(980px,100%);max-height:94vh;overflow:auto;border-radius:10px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.request-view-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #ddd}.request-view-head h2{margin:0}.request-view-close{border:0;background:transparent;font-size:30px;cursor:pointer}.leave-preview{padding:22px;background:#ececec}.hr-leave-form{background:#fff;border:1px solid #aaa;padding:18px;max-width:900px;margin:auto;color:#222;font-family:Arial,Helvetica,sans-serif}.hr-leave-title{border:3px solid #222;text-align:center;padding:8px;font-size:25px;font-weight:500;letter-spacing:.5px;margin-bottom:20px}.hr-line-grid{display:grid;grid-template-columns:80px 1fr 42px 1fr;gap:8px;align-items:end;margin:8px 0 18px}.hr-line-grid span,.hr-requested span,.hr-signature-row span,.hr-supervisor-fields span{font-size:12px}.hr-line{border-bottom:1px solid #555;min-height:22px;padding:3px}.hr-section-title{border:2px solid #444;text-align:center;font-weight:700;font-size:13px;padding:6px;text-transform:uppercase;margin:16px 0}.hr-reason-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 20px;padding:0 4px}.hr-reason-option{display:grid;grid-template-columns:24px auto 1fr;align-items:center;gap:5px;min-height:30px;font-size:12px}.hr-box{width:19px;height:19px;border:1px solid #555;display:inline-grid;place-items:center}.hr-reason-line{border-bottom:1px solid #777;min-height:20px}.hr-requested{display:grid;grid-template-columns:70px 1fr 65px 1fr 1fr 170px;gap:7px 9px;align-items:end;font-size:12px;padding:0 8px}.hr-wide{grid-column:2/-1}.hr-signature-row{display:grid;grid-template-columns:100px 1fr 45px 180px;gap:8px;align-items:end;font-size:12px;border-top:1px solid #777;padding-top:13px;margin-top:18px}.hr-supervisor-box{border:3px solid #222;text-align:center;font-size:13px;font-weight:700;padding:7px;margin:15px 0 18px}.hr-comments{min-height:54px;border-top:1px solid #777;border-bottom:1px solid #777;padding:8px;font-size:12px}.hr-supervisor-fields{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:12px}.leave-preview-actions{display:flex;justify-content:flex-end;gap:10px;padding:18px 22px;border-top:1px solid #ddd}.leave-preview-btn{border:1px solid #ccc;border-radius:6px;padding:10px 17px;background:#fff;cursor:pointer;font-weight:700}.leave-preview-btn.primary{background:#1769e0;color:#fff;border-color:#1769e0}.notification-actions{display:flex;align-items:center;gap:8px}.notification-view{border:0;border-radius:6px;padding:8px 12px;background:#1769e0;color:#fff;cursor:pointer;font-weight:700}.notification-read{border:1px solid #ddd;border-radius:6px;padding:8px 10px;background:#fff;cursor:pointer}@media(max-width:700px){.hr-line-grid{grid-template-columns:80px 1fr}.hr-reason-grid{grid-template-columns:1fr}.hr-requested{grid-template-columns:65px 1fr}.hr-wide{grid-column:2}.hr-signature-row{grid-template-columns:100px 1fr}.hr-supervisor-fields{grid-template-columns:1fr}.notification-actions{flex-direction:column;align-items:stretch}.hr-leave-title{font-size:19px}}@media print{.request-view-head,.leave-preview-actions{display:none!important}.leave-preview{padding:0;background:#fff}.hr-leave-form{border:0;box-shadow:none;max-width:none}}
  </style>
</head>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Notifications | Modern Tech</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a href="index.html" class="header__logo"
          ><i class="ri-cloud-fill"></i><span>Modern Tech</span></a
        >
        <div class="header__toggle" id="header-toggle">
          <i class="ri-menu-line"></i>
        </div>
      </div>
    </header>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar__container">
        <div class="sidebar__user">
          <div class="sidebar__img">
            <img
              id="navbarProfileImage"
              src="https://i.ibb.co/gF6c7Yj8/Make-Something-Special-with-our-Adorable-Craft.jpg"
              alt="Profile"
            />
          </div>
          <div class="sidebar__info">
            <h3 id="sidebar-user-name">HR</h3>
            <span id="sidebar-user-email">info@moderntech.co.za</span
            ><span class="user-profile">HR</span>
          </div>
        </div>
        <div class="sidebar__content">
          <div>
            <h3 class="sidebar__title">MANAGE</h3>
            <div class="sidebar__list">
              <a href="index.html" class="sidebar__link"
                ><i class="ri-pie-chart-2-fill"></i><span>Dashboard</span></a
              ><a href="data.html" class="sidebar__link"
                ><i class="ri-team-fill"></i><span>Employees Data</span></a
              ><a href="payroll.html" class="sidebar__link"
                ><i class="ri-secure-payment-fill"></i><span>Payroll</span></a
              ><a href="attendance.html" class="sidebar__link"
                ><i class="ri-calendar-event-fill"></i
                ><span>Attendance</span></a
              ><a href="calendar.html" class="sidebar__link"
                ><i class="ri-calendar-fill"></i><span>Calendar</span></a
              >
            </div>
          </div>
          <div>
            <h3 class="sidebar__title">SETTINGS</h3>
            <div class="sidebar__list">
              <a href="notifications.html" class="sidebar__link active-link"
                ><i class="ri-notification-3-fill"></i><span>Notifications</span
                ><span id="notification-count" class="notification-badge"
                  >0</span
                ></a
              ><a href="settings.html" class="sidebar__link"
                ><i class="ri-settings-3-fill"></i><span>Settings</span></a
              ><a href="reviews.html" class="sidebar__link"
                ><i class="ri-mail-unread-fill"></i><span>Reviews</span></a
              >
            </div>
          </div>
        </div>
        <div class="sidebar__actions">
          <div class="sidebar__link" id="theme-button">
            <i class="ri-moon-clear-fill"></i><span>Theme</span>
          </div>
          <div class="sidebar__link" id="logout-btn">
            <i class="ri-logout-box-r-fill"></i><span>Log Out</span>
          </div>
        </div>
      </div>
    </nav>
    <main class="main container">
      <section class="notifications-page">
        <div class="main__header">
          <div>
            <h1>Notifications</h1>
            <p>Employee messages and leave requests sent to HR.</p>
          </div>
          <button class="settings__btn" id="mark-all-read">
            Mark all as read
          </button>
        </div>
        <div class="notification-filters">
          <button class="notification-filter active" data-filter="all">
            All</button
          ><button class="notification-filter" data-filter="leave">
            Leave Requests</button
          ><button class="notification-filter" data-filter="message">
            Messages</button
          ><button class="notification-filter" data-filter="unread">
            Unread
          </button>
        </div>
        <div id="notifications-list" class="notifications-list">
          <div class="notification-empty">Loading notifications...</div>
        </div>
      </section>
    </main>
    <script src="js/core.js"></script>
    <script src="js/notifications.js"></script>
  </body>
</html>

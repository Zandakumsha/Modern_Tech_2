<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Employee Leave Request | Modern Tech</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#ececec;color:#222;font-family:Arial,Helvetica,sans-serif}.leave-page{min-height:100vh;padding:28px}.leave-card{max-width:980px;margin:auto;background:#fff;border:1px solid #aaa;box-shadow:0 2px 16px rgba(0,0,0,.18);padding:18px}.leave-head{display:flex;align-items:center;justify-content:center;position:relative;border:3px solid #222;padding:8px 50px;margin-bottom:20px}.leave-head h1{font-size:25px;margin:0;font-weight:500;letter-spacing:.5px}.leave-close{position:absolute;right:8px;top:4px;border:0;background:transparent;font-size:30px;cursor:pointer}.leave-body{padding:0 6px}.emp-line-grid{display:grid;grid-template-columns:80px minmax(0,1fr) 42px minmax(0,1fr);gap:8px;align-items:end;margin:8px 0 18px}.emp-line-grid label{font-size:12px}.line-input{width:100%;min-width:0;border:0;border-bottom:1px solid #555;outline:0;background:transparent;padding:3px;font:inherit}.section-title{border:2px solid #444;text-align:center;font-weight:700;font-size:13px;padding:6px;text-transform:uppercase;margin:16px 0}.reason-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 20px;padding:0 4px}.reason-option{display:grid;grid-template-columns:24px auto minmax(0,1fr);align-items:center;gap:5px;min-height:30px;font-size:12px}.reason-option input{width:19px;height:19px;margin:0}.reason-option .reason-line{border:0;border-bottom:1px solid #777;outline:0;width:100%;min-width:0;background:transparent;padding:2px}.leave-requested{display:grid;grid-template-columns:70px minmax(0,1fr) 65px minmax(0,1fr) minmax(70px,1fr) minmax(120px,170px);gap:7px 9px;align-items:end;font-size:12px;padding:0 8px}.leave-requested .wide{grid-column:2/-1}.leave-requested label{white-space:nowrap}.signature-row{display:grid;grid-template-columns:100px minmax(0,1fr) 45px minmax(120px,180px);gap:8px;align-items:end;font-size:12px;border-top:1px solid #777;padding-top:13px;margin-top:18px}.supervisor-box{border:3px solid #222;text-align:center;font-size:13px;font-weight:700;padding:7px;margin:15px 0 18px}.comments{width:100%;height:52px;border:0;border-bottom:1px solid #777;border-top:1px solid #777;outline:0;resize:vertical;background:transparent;padding:7px}.supervisor-fields{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:12px}.supervisor-fields>label{display:contents}.supervisor-fields input{border:0;border-bottom:1px solid #777;outline:0;background:transparent;padding:4px}.leave-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.btn{border:1px solid #777;background:#fff;padding:10px 18px;font-weight:700;cursor:pointer}.btn.primary{background:#222;color:#fff}.status{display:none;margin:12px 0;padding:10px;border:1px solid #b22}.status.show{display:block}.status.success{border-color:#287a45;color:#176434}.result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}.result-overlay.show{display:flex}.result-box{background:#fff;padding:28px;max-width:450px;width:100%;text-align:center;border-radius:10px}.result-actions{display:flex;justify-content:center;gap:10px;margin-top:18px}
@media(max-width:850px){.leave-page{padding:14px}.reason-grid{grid-template-columns:1fr 1fr}.leave-requested{grid-template-columns:70px minmax(0,1fr) 65px minmax(0,1fr)}.leave-requested .wide{grid-column:2/-1}}
@media(max-width:650px){.leave-card{padding:12px}.leave-head{padding:9px 42px}.leave-head h1{font-size:19px}.emp-line-grid{grid-template-columns:80px minmax(0,1fr)}.emp-line-grid label:nth-of-type(2){grid-column:1}.emp-line-grid input:nth-of-type(3){grid-column:2}.reason-grid{grid-template-columns:1fr}.leave-requested{grid-template-columns:65px minmax(0,1fr)}.leave-requested .wide{grid-column:2}.signature-row{grid-template-columns:100px minmax(0,1fr)}.supervisor-fields{grid-template-columns:1fr}.supervisor-fields>label{display:block}.supervisor-fields input{width:100%}.leave-actions,.result-actions{flex-direction:column}.leave-actions .btn,.result-actions .btn{width:100%}.result-box{padding:20px}}
@media(max-width:400px){.leave-page{padding:6px}.leave-card{padding:9px}.leave-body{padding:0 2px}.emp-line-grid{grid-template-columns:1fr}.emp-line-grid label,.emp-line-grid input{grid-column:1!important}.reason-option{grid-template-columns:24px auto minmax(0,1fr)}.leave-requested{grid-template-columns:1fr}.leave-requested .wide{grid-column:1}.signature-row{grid-template-columns:1fr}.signature-row label,.signature-row div{width:100%}.section-title{font-size:12px}.leave-head h1{font-size:17px}}
@media print{body{background:#fff}.leave-page{padding:0}.leave-card{box-shadow:none;border:0;max-width:none}.leave-close,.leave-actions,.status,.result-overlay{display:none!important}}
</style></head>
<body><div class="leave-page"><div class="leave-card"><header class="leave-head"><h1>Employee Leave Request Form</h1><button class="leave-close" id="exit-top" type="button">&times;</button></header><div id="status" class="status"></div><form id="leave-form"><div class="leave-body"><div class="emp-line-grid"><label>Employee Name</label><input id="employee-name" class="line-input" name="employeeName" readonly><label>Date</label><input id="request-date" class="line-input" name="requestDate" readonly><label>Department</label><input id="department" class="line-input" name="department" readonly><label>Supervisor Name</label><input id="supervisor" class="line-input" name="supervisor" readonly></div><div class="section-title">Reason for Leave</div><div class="reason-grid"><label class="reason-option"><input type="checkbox" name="vacation" value="Vacation"><span>Vacation</span><input class="reason-line" name="vacationReason"></label><label class="reason-option"><input type="checkbox" name="juryAssignment" value="Civil Leave/Jury Duty"><span>Civil Leave/Jury Duty</span><input class="reason-line" name="juryReason"></label><label class="reason-option"><input type="checkbox" name="military" value="Military"><span>Military</span><input class="reason-line" name="militaryReason"></label><label class="reason-option"><input type="checkbox" name="sickSelf" value="Sick - Self"><span>Sick - Self</span><input class="reason-line" name="sickSelfReason"></label><label class="reason-option"><input type="checkbox" name="sickFamily" value="Sick - Family"><span>Sick - Family</span><input class="reason-line" name="sickFamilyReason"></label><label class="reason-option"><input type="checkbox" name="appointment" value="Sick - Doctor Appointment"><span>Sick - Dr Appointment</span><input class="reason-line" name="appointmentReason"></label><label class="reason-option"><input type="checkbox" name="workersComp" value="Workers Compensation"><span>Workers Comp</span><input class="reason-line" name="workersCompReason"></label><label class="reason-option"><input type="checkbox" name="familyMedical" value="Family and Medical"><span>Family and Medical</span><input class="reason-line" name="familyMedicalReason"></label><label class="reason-option"><input type="checkbox" name="leaveAbsence" value="Leave of Absence"><span>Leave of Absence</span><input class="reason-line" name="leaveAbsenceReason"></label><label class="reason-option"><input type="checkbox" name="funeral" value="Funeral Relationship"><span>Funeral Relationship</span><input class="reason-line" name="funeralReason"></label><label class="reason-option"><input type="checkbox" name="otherReasonType" value="Other"><span>Other</span><input class="reason-line" name="other"></label></div><div class="section-title">Leave Requested</div><div class="leave-requested"><label>From</label><input id="start-date" class="line-input" name="startDate" type="date" required><label>Time</label><input id="start-time" class="line-input" name="startTime" type="time"><label>a.m./p.m.</label><label>Total Number of Hours Requested</label><input id="hours" class="line-input" name="hours" type="number" min="0"><label>To</label><input id="end-date" class="line-input" name="endDate" type="date" required><label>Time</label><input id="end-time" class="line-input" name="endTime" type="time"><label>a.m./p.m.</label><label>Total Number of Days Requested</label><input id="days" class="line-input" name="days" type="number" min="1" readonly><label>Other</label><input class="line-input wide" name="reasonNotes"><label class="wide">Additional Notes</label><input class="line-input wide" name="notes"></div><div class="signature-row"><label>Employee Signature</label><div id="employee-signature" class="line-input"></div><label>Date</label><div id="signature-date" class="line-input"></div></div><div class="supervisor-box">SUPERVISOR USE ONLY</div><label>Comments</label><textarea class="comments" name="comments" placeholder="Supervisor comments"></textarea><div class="supervisor-fields"><label>Approved By:</label><input name="managerName"><label>Supervisor Signature:</label><input name="managerSignature"><label>Date:</label><input type="date" name="managerDate"></div></div><div class="leave-actions"><button class="btn" type="button" id="exit-btn">Exit</button><button class="btn primary" type="submit" id="submit-btn">Submit Request</button></div></form></div></div><div class="result-overlay" id="result-overlay"><div class="result-box"><i class="ri-checkbox-circle-fill"></i><h2>Leave Request Submitted</h2><p>Your leave request has been sent to HR.</p><div class="result-actions"><button class="btn" id="result-exit" type="button">Exit</button><button class="btn primary" id="download-pdf" type="button"><i class="ri-download-2-line"></i> Download Form</button></div></div></div><script src="js/leave-request.js"></script></body></html>
